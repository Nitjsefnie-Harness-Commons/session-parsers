name: types

# pyright over the shipped package. The suites are excluded in
# pyrightconfig.json: they load their target by path and reach into module
# internals on purpose, which a type checker can only ever call an error.
#
# pythonPlatform is "All" rather than the runner's: these parsers read
# Windows-spelled paths on a Linux box and vice versa, and the branches for
# each are guarded at runtime, not by the platform the check happens to run on.
#
# No runtime dependencies to install -- the package is stdlib-only.

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

# Least privilege: this job only reads the tree. Without an explicit
# block it inherits the repository default, which can be read/write
# for the whole token.
permissions:
  contents: read

concurrency:
  group: types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job pushes. Leaving the token in
          # .git/config lets any later step reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the type checker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pyright
        run: pyright
