name: types

# pyright over the shipped package. The suites are excluded in
# pyrightconfig.json: they load their target by path and reach into module
# internals on purpose, which a type checker can only ever call an error.
#
# pythonPlatform is "All" rather than the runner's: these parsers read
# Windows-spelled paths on a Linux box and vice versa, and the branches for
# each are guarded at runtime, not by the platform the check happens to run on.
#
# No runtime dependencies to install -- the package is stdlib-only.

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
  workflow_dispatch:

concurrency:
  group: types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install the type checker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pyright
        run: pyright
