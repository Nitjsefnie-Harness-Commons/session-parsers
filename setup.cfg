[pycodestyle]
max-line-length = 10000
exclude = .idea, .venv, build, dist
# `ignore` REPLACES pycodestyle's defaults rather than adding to them, and
# pycodestyle has no extend-ignore (that is flake8), so the defaults are
# restated here. Dropping them re-enables the mutually exclusive W503/W504
# pair. Nothing beyond the defaults is ignored: unlike the mailbox there is no
# compatibility facade here, so every module can satisfy the plain rules.
# Beyond the defaults, only codes the code violates DELIBERATELY for
# alignment: E272/E114/E116/E127 are aligned dispatch and rate tables whose
# columns are the readable part, E203 is slice spacing (the rule black
# disagrees with), and E129 is a visually indented multi-line condition. Real
# defects the gate found -- an ambiguous `l`, a missing comma space, a nested
# def with no blank line -- were fixed rather than ignored.
ignore = E121,E123,E126,E226,E24,E704,W503,W504,E203,E272,E114,E116,E127,E129
